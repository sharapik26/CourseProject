version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: navigator
      POSTGRES_PASSWORD: navigator
      POSTGRES_DB: sensory_users
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigator -d sensory_users"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_PORT: "8081"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: navigator
      DB_PASSWORD: navigator
      DB_NAME: sensory_users
      DB_SSLMODE: disable
      JWT_SECRET: dev-jwt-secret
      JWT_TTL: 168h
      BCRYPT_COST: "10"
    ports:
      - "8081:8081"

volumes:
  dbdata: {}